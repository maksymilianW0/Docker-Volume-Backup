[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "docker-volume-backup"
version = "0.1.0"
description = "Tworzy lokalną kopię zapasową volume Dockera jako archiwum tar."
readme = "README.md"
requires-python = ">=3.9"
dependencies = ["docker>=7.1.0"]

[project.scripts]
dvb = "docker_volume_backup.cli:main"
docker-volume-backup = "docker_volume_backup.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
